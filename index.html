<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1b2f">
<title>HSKもじバトル — 単語で戦う中国語ゲーム</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%23e63946%22/%3E%3Ctext x=%228%22 y=%2213%22 font-size=%2212%22 text-anchor=%22middle%22 fill=%22%23ffd166%22%3E字%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <!-- タイトル -->
  <section id="scr-title" class="screen active">
    <div class="logo"><span class="logo-zh">汉字大战</span><span class="logo-ja">HSKもじバトル</span><span class="logo-sub">HSK 1級・150語</span></div>
    <canvas id="title-art" width="96" height="40" aria-hidden="true"></canvas>
    <div class="menu">
      <button class="btn big primary" id="btn-start">▶ はじめる</button>
      <button class="btn big" id="btn-review">✎ まちがえた単語を復習</button>
      <button class="btn" id="btn-settings">⚙ 設定</button>
    </div>
    <p class="hint desktop-only">キーボード：1〜4で解答／スペースで音声</p>
    <p class="voice-note" id="voice-note"></p>
  </section>

  <!-- ステージ選択 -->
  <section id="scr-select" class="screen">
    <header class="bar"><button class="btn small" data-go="title">← もどる</button><h2>ステージをえらぶ</h2></header>
    <div id="stage-list" class="stage-list"></div>
  </section>

  <!-- 設定 -->
  <section id="scr-settings" class="screen">
    <header class="bar"><button class="btn small" data-go="title">← もどる</button><h2>設定</h2></header>
    <div class="panel">
      <label class="row"><input type="checkbox" id="set-timer"> タイマーあり（時間切れはミス）</label>
      <label class="row"><input type="checkbox" id="set-autoplay"> 正解したら単語を読み上げる</label>
      <label class="row">読み上げの速さ <input type="range" id="set-rate" min="0.5" max="1.2" step="0.1"> <span id="rate-val"></span></label>
      <button class="btn" id="btn-voicetest">🔊 音声テスト「你好」</button>
      <p class="voice-note" id="voice-note2"></p>
      <hr>
      <button class="btn danger" id="btn-reset">記録をすべて消す</button>
    </div>
  </section>

  <!-- ゲーム -->
  <section id="scr-game" class="screen">
    <div class="stage-wrap">
      <canvas id="stage" width="320" height="180"></canvas>
      <div class="hud-top">
        <div id="hud-hp" class="hp" aria-label="HP"></div>
        <div id="hud-stage" class="hud-stage"></div>
        <div id="hud-score" class="score">0</div>
      </div>
      <div id="banner" class="banner"></div>
      <button id="btn-pause" class="btn small pause" aria-label="ポーズ">Ⅱ</button>
    </div>
    <div class="timer"><div id="timer-fill"></div></div>
    <div class="quiz">
      <div id="tut-tip" class="tut-tip"></div>
      <div id="q-kind" class="q-kind"></div>
      <div id="q-main" class="q-main"></div>
      <div id="q-sub" class="q-sub"></div>
      <button id="btn-play" class="btn play" aria-label="もう一度聞く">🔊 もう一度聞く</button>
      <div id="q-feedback" class="q-feedback" aria-live="polite"></div>
      <div id="choices" class="choices"></div>
    </div>
  </section>

  <!-- 結果 -->
  <section id="scr-result" class="screen">
    <div class="panel result">
      <h2 id="res-title"></h2>
      <div class="res-stats">
        <div><span>正答率</span><b id="res-acc"></b></div>
        <div><span>スコア</span><b id="res-score"></b></div>
        <div><span>ベスト</span><b id="res-best"></b></div>
      </div>
      <p id="res-unlock" class="res-unlock"></p>
      <h3>今回まちがえた単語</h3>
      <ul id="res-miss" class="word-list"></ul>
      <h3>よくまちがえる単語（これまでの記録）</h3>
      <ul id="res-top" class="word-list"></ul>
      <div class="menu">
        <button class="btn big primary" id="btn-next">つぎのステージへ ▶</button>
        <button class="btn" id="btn-retry">もう一度</button>
        <button class="btn" id="btn-res-review">まちがえた単語を復習</button>
        <button class="btn" data-go="select">ステージ選択へ</button>
      </div>
    </div>
  </section>

  <!-- ポーズ -->
  <div id="pause" class="modal">
    <div class="panel">
      <h2>ポーズ</h2>
      <div class="menu">
        <button class="btn big primary" id="btn-resume">つづける</button>
        <button class="btn" id="btn-quit">ステージ選択にもどる</button>
      </div>
    </div>
  </div>
</div>
<script src="data/words.js"></script>
<script src="js/pinyin.js"></script>
<script src="js/art.js"></script>
<script src="js/game.js"></script>
</body>
</html>
